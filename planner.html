    <main>
        <section class="card">
            <h2 class="section-title">Interactive Academic Task Planner</h2>
            <p>Manage coursework, cyber security studies, and travel goals efficiently using this task management interface.</p>
            <br>
            <form id="planner-form" class="planner-form">
                <input type="text" id="task-input" placeholder="Enter a new academic task..." required>
                <select id="task-category">
                    <option value="Cyber Security">Cyber Security</option>
                    <option value="Web Development">Web Development</option>
                    <option value="General Study">General Study</option>
                    <option value="Personal / Travel">Personal / Travel</option>
                </select>
                <button type="submit">Add Task</button>
            </form>

            <ul id="task-list" class="task-list">
                <!-- Dynamic Tasks Render Here -->
            </ul>
        </section>
